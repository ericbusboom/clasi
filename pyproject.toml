[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clasi"
version = "0.20260821.1"
description = "MCP server for AI-driven software engineering process — agents, skills, instructions, and artifact management"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Eric Busboom"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click>=8.0",
    "dotconfig @ git+https://github.com/ericbusboom/dotconfig.git",
    "jinja2>=3.0",
    "jsonschema>=4.0",
    "mcp>=1.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "python-frontmatter>=1.1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
clasi = "clasi.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tests/e2e/e2e-project"]
addopts = "-m 'not slow'"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

[tool.coverage.run]
branch = true
source = ["src/clasi"]
omit = [
    "*/clasi/cli.py",
    "*/clasi/hook_handlers.py",
    "*/clasi/mcp_server.py",
]

[tool.coverage.report]
fail_under = 84
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.coverage.paths]
# Remaps the e2e container's wheel-installed path back to this repo's own
# src/clasi layout (ticket 032/007; SUC-006). Only meaningful for
# combining/reporting on coverage collected INSIDE the e2e container
# (tests/e2e/) — this repo's own unit-gate coverage (`just test-all`)
# never needs remapping, since it measures src/clasi directly, in place.
# tests/e2e/.coveragerc carries an equivalent [paths] section, and that
# is what tests/e2e/coverage.sh actually uses at combine/report time —
# see that file's header for why: this table's sibling
# [tool.coverage.run].omit above excludes cli.py/hook_handlers.py/
# mcp_server.py for the unit gate, but the e2e/real-app report must NOT
# omit them, and coverage.py has no CLI flag that overrides a config
# file's own `omit` list at report time (verified empirically while
# building this harness: `coverage report --omit=` does not clear a
# rcfile's [run] omit). This table exists so the path mapping itself is
# documented in one canonical place, and is directly usable by anyone who
# deliberately wants pyproject.toml's own (unit-gate) omit view applied
# to e2e-collected data.
source = [
    "src/clasi",
    "*/site-packages/clasi",
]

[tool.setuptools.package-data]
clasi = [
    "contract-schema.yaml",
    "init/*.md",
    "plugin/**/*",
    "schemas/**/*",
    "templates/*.md",
    "design/templates/*.md",
    "se-overview-template.md",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["clasi*"]

