version: 1
name: se-process
description: >
  CLASI Software Engineering process — full DAG of planning and execution
  artifacts from roadmap through close.

artifacts:
  - id: roadmap
    generates: docs/clasi/overview.md
    instruction: clasi/schemas/se-process/instructions/overview.md
    requires: []

  - id: planning-docs
    generates: docs/clasi/sprints/<id>/sprint.md
    instruction: clasi/schemas/se-process/instructions/specification.md
    requires:
      - roadmap

  - id: architecture-review
    generates: docs/clasi/sprints/<id>/sprint.md
    instruction: clasi/schemas/se-process/instructions/architecture-update.md
    requires:
      - planning-docs
    gate:
      kind: review
      record: architecture_review

  - id: stakeholder-review
    generates: docs/clasi/sprints/<id>/stakeholder-review.md
    instruction: clasi/schemas/se-process/instructions/usecases.md
    requires:
      - architecture-review
    gate:
      kind: stakeholder-review
      record: stakeholder_approval

  - id: ticketing
    generates: docs/clasi/sprints/<id>/tickets/
    instruction: clasi/schemas/se-process/instructions/tickets.md
    requires:
      - stakeholder-review

  - id: executing
    generates: docs/clasi/sprints/<id>/tickets/<id>.md (updated to done)
    instruction: clasi/schemas/se-process/instructions/execution.md
    requires:
      - ticketing
    gate:
      kind: per-ticket
      record: per_ticket_done
    lock: execution

  - id: closing
    generates: docs/clasi/sprints/<id>/close-report.md
    instruction: clasi/schemas/se-process/instructions/close.md
    requires:
      - executing

  - id: done
    generates: docs/clasi/sprints/<id>/ (archived)
    instruction: clasi/schemas/se-process/instructions/sprint-plan.md
    requires:
      - closing
