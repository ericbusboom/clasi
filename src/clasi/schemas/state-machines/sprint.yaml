machine: sprint
context: SprintContext
initial: open

states:

  open:
    description: |
      The sprint directory and sprint.md exist. No planning artifacts
      yet.
    invariants:
      - is_sprint_doc_present
    transitions:
      plan:
        to: planned
        conditions: []
        action: write_planning_docs

  planned:
    description: |
      Planning is present in sprint.md (its Architecture and Use Cases
      sections, sized to the change). Architecture review has not yet
      been recorded.
    invariants:
      - is_sprint_doc_present
    transitions:
      architecture-review:
        to: pre-flight
        conditions: []
        action: record_architecture_review

  pre-flight:
    description: |
      Architecture review has been recorded (or skipped). Sprint pauses
      here for stakeholder pre-flight review; recording a
      `stakeholder_approval` gate result of `passed` or `skipped`
      satisfies `is_pre_flight_satisfied` and unblocks the `ticketed`
      state.
    invariants:
      - is_sprint_doc_present
      - is_architecture_review_recorded
    transitions:
      confirm-pre-flight:
        to: ticketed
        conditions: []
        action: write_tickets

  ticketed:
    description: |
      Tickets have been written. Sprint is ready to execute but no
      execution lock has been acquired yet.
    invariants:
      - is_sprint_doc_present
      - is_architecture_review_recorded
      - is_pre_flight_satisfied
      - is_at_least_one_ticket
    transitions:
      execute:
        to: executing
        conditions:
          - is_no_other_sprint_executing
        action: acquire_execution_lock

  executing:
    description: |
      Sprint owns the execution lock. HEAD is on its branch. Tickets
      may be in any state in the ticket machine.
    invariants:
      - is_on_sprint_branch
      - is_execution_lock_held_by_this_sprint
      - is_at_least_one_ticket
    transitions:
      complete:
        to: review
        conditions: []
        action: enter_review

  review:
    description: |
      All tickets are done. Sprint pauses here for post-execution
      review before closing.
    invariants:
      - is_on_sprint_branch
      - is_execution_lock_held_by_this_sprint
      - is_all_tickets_done
    transitions:
      close:
        to: closed
        conditions: []
        action: close_sprint

  closed:
    description: |
      Sprint has been merged into the default branch and archived.
      Execution lock has been released.

      `is_sprint_archived` is the sole invariant (031/001): `closed`
      previously also required a merged-branch check, but `close_sprint`
      deletes the sprint branch after merging it (`delete_branch=True`
      by default), so that invariant could never be satisfied for a
      correctly closed sprint -- the toolchain destroyed the very signal
      the invariant checked. `close_sprint` performs merge, archive, and
      branch deletion atomically, so the archive location alone already
      implies the merge happened. This is also a cheap,
      directory-location-based check with no git subprocess cost.
    invariants:
      - is_sprint_archived
    transitions: {}

predicates:
  is_sprint_doc_present:
    description: Returns True iff .clasi/sprints/<id>-<slug>/sprint.md exists with id and title set.
  is_architecture_review_recorded:
    description: |
      Returns True iff the state DB has an `architecture_review` gate
      record for this sprint with result `passed` or `skipped`.
  is_pre_flight_satisfied:
    description: |
      Returns True iff the state DB has a `stakeholder_approval` gate
      record for this sprint with result `passed` or `skipped`.
  is_at_least_one_ticket:
    description: Returns True iff .clasi/sprints/<id>-<slug>/tickets/ contains at least one ticket file.
  is_no_other_sprint_executing:
    description: Returns True iff no other sprint holds the execution lock.
  is_on_sprint_branch:
    description: Returns True iff git HEAD is this sprint's branch.
  is_execution_lock_held_by_this_sprint:
    description: Returns True iff the execution lock in the state DB is held by this sprint.
  is_all_tickets_done:
    description: Returns True iff every ticket in this sprint is in the ticket-machine `done` state.
  is_sprint_archived:
    description: Returns True iff the sprint directory lives under sprints/done/ (a cheap, git-free, directory-location check).

actions:
  write_planning_docs:
    description: Fills in the sprint.md Architecture and Use Cases sections (sized to the change).
  record_architecture_review:
    description: Records the `architecture_review` gate result (passed or skipped) in the state DB.
  write_tickets:
    description: Generates ticket files in .clasi/sprints/<id>-<slug>/tickets/ from sprint.md's Architecture and Use Cases sections.
  acquire_execution_lock:
    description: |
      Acquires the project-wide execution lock and binds it to this
      sprint. Triggers the project machine's `enter-sprint` transition.
  enter_review:
    description: |
      Generates an initial close-report.md draft.
  close_sprint:
    description: |
      Merges the sprint branch into default, archives the sprint
      directory, releases the execution lock, and triggers the
      project machine's `exit-sprint` transition.
